services:
  api:
    image: node:23
    working_dir: /workspace
    command: npm run dev:api
    ports:
      - "4000:4000"
    volumes:
      - ../..:/workspace

  web:
    image: node:23
    working_dir: /workspace
    command: npm run dev:web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ../..:/workspace
