name: aislop Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: aislop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # source tag: actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        # source tag: actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.x
          cache: npm

      - name: Run aislop
        run: npx --yes aislop@0.9.4 ci .
